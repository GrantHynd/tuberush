appId: com.tuberush.v2
name: Offline replay (Android only)
tags: [android-only]
---
# =============================================================================
# LOCAL ONLY — offline play + sync (offline-sync audit, TUB-275..280)
# `setAirplaneMode` is Android-only in Maestro, so this is NOT run in CI (iOS).
# Needs a real Supabase backend and an existing test account with a city set:
#   maestro test -e TEST_EMAIL=... -e TEST_PASSWORD=... .maestro/offline_airplane_flow.yaml
# =============================================================================

- setAirplaneMode: disabled
- launchApp:
    clearState: true

# Sign in online so the session and the puzzle cache (past 7 + next 7 days) are populated.
- runFlow:
    file: subflows/sign_in.yaml
    env:
      EMAIL: ${TEST_EMAIL}
      PASSWORD: ${TEST_PASSWORD}
- extendedWaitUntil:
    visible:
      id: "today-hero"
    timeout: 20000

# Go offline and cold-start: today's puzzle must come from the cache.
- setAirplaneMode: enabled
- stopApp
- launchApp
- tapOn:
    id: "today-hero-connections"
- extendedWaitUntil:
    visible:
      id: "connections-grid|connections-finished"
    timeout: 20000
- assertNotVisible: "Puzzle unavailable"

# Play a guess offline (tiles are tile-<word>; match by regex + index).
- runFlow:
    when:
      visible:
        id: "connections-grid"
    commands:
      - tapOn: { id: "tile-.*", index: 0 }
      - tapOn: { id: "tile-.*", index: 1 }
      - tapOn: { id: "tile-.*", index: 2 }
      - tapOn: { id: "tile-.*", index: 3 }
      - tapOn: { id: "btn-submit" }

# Back online: the queue and the score outbox drain on reconnect/foreground.
- setAirplaneMode: disabled
- stopApp
- launchApp
- tapOn: "Profile"
- extendedWaitUntil:
    visible:
      id: "sync-status"
      text: ".*Synced"
    timeout: 30000
