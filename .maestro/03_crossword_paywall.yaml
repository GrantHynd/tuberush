appId: com.tuberush.v2
name: Crossword paywall shown for free users
tags: [critical]
---
- runFlow:
    file: subflows/sign_in.yaml
    env:
      EMAIL: ${MAESTRO_TEST_EMAIL}
      PASSWORD: ${MAESTRO_TEST_PASSWORD}
- extendedWaitUntil:
    visible:
      id: "today-hero-crossword"
    timeout: 30000
- tapOn:
    id: "today-hero-crossword"
# Free users go straight to the RevenueCat paywall (TUB-323): no "Go Premium!" page.
- assertNotVisible:
    id: "subscribe-button"
- extendedWaitUntil:
    visible:
      text: ".*(Restore|Subscribe|Continue|Terms|Privacy).*"
    timeout: 20000
- assertNotVisible:
    id: "crossword-upsell-cta"
