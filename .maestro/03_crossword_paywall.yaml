appId: com.tuberush.v2
name: Crossword paywall shown for free users
tags: [critical]
---
- runFlow:
    file: subflows/sign_in.yaml
    env:
      EMAIL: ${MAESTRO_TEST_EMAIL}
      PASSWORD: ${MAESTRO_TEST_PASSWORD}
- extendedWaitUntil:
    visible:
      id: "today-hero-crossword"
    timeout: 30000
- tapOn:
    id: "today-hero-crossword"
# Free users go straight to the single purchase screen (no intermediate paywall page).
- extendedWaitUntil:
    visible:
      id: "subscribe-button"
    timeout: 20000
- assertNotVisible:
    id: "crossword-upsell-cta"
